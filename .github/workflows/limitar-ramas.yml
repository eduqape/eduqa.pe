name: Eliminar ramas fuera de dev, qa y main
run-name: >-
  ${{ github.ref_type != 'branch' && format('Ignorar la etiqueta {0}', github.ref_name)
  || contains(fromJSON('["main", "dev", "qa"]'), github.ref_name) && format('Conservar la rama {0}', github.ref_name)
  || format('Eliminar la rama {0}', github.ref_name) }}

on:
  create:
  push:
    branches-ignore: [main, dev, qa]

permissions:
  contents: write

jobs:
  retirar-rama:
    name: Eliminar la rama ${{ github.ref_name }}
    if: github.ref_type == 'branch' && github.ref_name != 'main' && github.ref_name != 'dev' && github.ref_name != 'qa'
    runs-on: ubuntu-latest
    steps:
      - name: Borrar la rama en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RAMA: ${{ github.ref_name }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          echo "Retirando la rama $RAMA: solo se mantienen main, dev y qa."
          gh api --method DELETE "repos/$REPOSITORIO/git/refs/heads/$RAMA"
