name: Promoción dev → qa → main

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read
  issues: read

concurrency:
  group: promocion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev:
    name: Validar dev
    runs-on: ubuntu-latest
    outputs:
      probar_fortran: ${{ steps.alcance.outputs.fortran }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar commits y detectar pruebas necesarias
        id: alcance
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            BASE_SHA="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || \
               ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null || \
               ! git merge-base --is-ancestor "$BEFORE_SHA" HEAD; then
            # Un push forzado puede dejar github.event.before fuera del historial
            # descargable. En ese caso se valida desde el último ancestro común
            # con main, que es la base publicada real de esta entrega.
            git fetch origin main
            BASE_SHA="$(git merge-base origin/main HEAD)"
          else
            BASE_SHA="$BEFORE_SHA"
          fi
          # Valida los commits de dev; un merge de main puede contener commits
          # ya publicados con otro formato que no pertenecen a esta entrega.
          git log --first-parent --format=%s "$BASE_SHA..HEAD" | npx --no -- commitlint
          git log --first-parent --format='%B%x00' "$BASE_SHA..HEAD" | node scripts/validar-tickets-commit.mjs --github
          git diff --name-only "$BASE_SHA" HEAD | node scripts/alcance-ci.mjs "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - run: node --test scripts/alcance-ci.test.mjs
      - run: npm run test:tickets
      - name: Seguridad — reglas del código y redirecciones
        run: npm run test:seguridad
      - name: Seguridad — dependencias de producción sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:marca
      - run: npm run test:catalogo
      - run: npm run test:cursos:runtime
      - run: npm run test:panel
      - run: npm run test:python:tools

  qa:
    name: Compilar y probar para qa
    if: github.event_name == 'push'
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar
        # Supabase apunta a un puerto cerrado: el build de CI no habla con la
        # base real y las pruebas HTTP atacan la aplicación sin credenciales.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
          NEXT_PUBLIC_SITIO_URL: http://127.0.0.1:3107
        run: npm run build
      - name: Seguridad — ataques HTTP contra el build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: npm run test:seguridad:http
      - name: Instalar compiladores para los cursos Fortran
        if: needs.dev.outputs.probar_fortran == 'true'
        run: sudo apt-get update && sudo apt-get install -y gfortran build-essential
      - if: needs.dev.outputs.probar_fortran == 'true'
        run: npm run test:fortran
      - if: needs.dev.outputs.probar_fortran == 'true'
        run: npx playwright install --with-deps chromium
      - if: needs.dev.outputs.probar_fortran == 'true'
        run: npm run test:fortran:web

  seguridad-db:
    name: Seguridad de la base de producción
    if: github.event_name == 'push'
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Solo lee el catálogo (políticas, permisos, funciones). Sin los secretos
      # las pruebas se omiten con un aviso en el resumen del workflow.
      - name: RLS, permisos por columna y funciones privilegiadas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm run test:seguridad:db

  promover-qa:
    name: Promover el commit verificado a qa
    if: github.event_name == 'push'
    needs: [qa, seguridad-db]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Avanzar qa solo por fast-forward
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          git fetch origin qa
          git merge-base --is-ancestor origin/qa "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/qa"

  promover-main:
    name: Promover el mismo commit de qa a main
    if: github.event_name == 'push'
    needs: promover-qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Promover qa a main sin reescribir historial
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          git fetch origin qa main
          test "$(git rev-parse origin/qa)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor origin/main origin/qa
          git push origin origin/qa:refs/heads/main
